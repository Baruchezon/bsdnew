name: Add cooking and baking page

on:
  push:
    branches: [main]
    paths:
      - '.cooking-update-trigger'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download baking image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eden-center-v2/assets
          curl -L --fail --retry 2 'https://images.pexels.com/photos/3807186/pexels-photo-3807186.jpeg?cs=srgb&dl=pexels-elly-fairytale-3807186.jpg&fm=jpg' -o eden-center-v2/assets/cooking-baking-children.jpg
          test -s eden-center-v2/assets/cooking-baking-children.jpg
          file eden-center-v2/assets/cooking-baking-children.jpg

      - name: Apply focused site changes
        shell: python
        run: |
          from pathlib import Path

          root = Path('eden-center-v2')

          # 1. Add the tenth navigation item site-wide through the shared app.js.
          app = root / 'app.js'
          text = app.read_text(encoding='utf-8')
          marker = '// cooking-baking-nav'
          if marker not in text:
              text += '''\n// cooking-baking-nav\n(function addCookingBakingNav(){\n  document.querySelectorAll('.menu').forEach(menu=>{\n    if(menu.querySelector('a[href="cooking-baking.html"]')) return;\n    const a=document.createElement('a');\n    a.href='cooking-baking.html';\n    a.textContent='בישול ואפייה';\n    const services=menu.querySelector('a[href="services.html"]');\n    if(services) services.insertAdjacentElement('afterend',a); else menu.appendChild(a);\n    const here=location.pathname.split('/').pop()||'index.html';\n    if(here==='cooking-baking.html') a.classList.add('active');\n  });\n})();\n'''
          text = text.replace("site-fixes.css?v=20260908-3", "site-fixes.css?v=20260909-1")
          app.write_text(text, encoding='utf-8')

          # 2. Compact only the desktop top navigation so ten items fit without changing the visual language.
          fixes = root / 'site-fixes.css'
          css = fixes.read_text(encoding='utf-8')
          css_marker = '/* cooking-baking-nav-fit */'
          if css_marker not in css:
              css += '''\n/* cooking-baking-nav-fit */\n@media(min-width:981px){.navrow{gap:.75rem}.menu{gap:.1rem}.menu a{padding:.62rem .52rem;font-size:.85rem}}\n.cookingPhoto>img{object-position:center 50%!important}\n'''
          fixes.write_text(css, encoding='utf-8')

          # 3. Add cooking and baking to the treatments page without touching existing treatment text.
          services = root / 'services.html'
          s = services.read_text(encoding='utf-8')
          block = '<h2>בישול ואפייה</h2><p>בישול ואפייה הם פעילות חווייתית ומובנית שיכולה לשמש כלי משלים בעבודה רגשית. העבודה במטבח משלבת בחירה, תכנון, מגע בחומרים, המתנה, התמודדות עם שינויים וחוויה ברורה של תוצאה והצלחה.</p><p><strong>למה זה חשוב:</strong> עבור ילדים מסוימים קל יותר לעבוד על ביטחון, התמדה, ויסות ושיתוף פעולה דרך עשייה מוחשית ומהנה ולא רק דרך שיחה. הכנת מאכל או עוגה מאפשרת לראות תהליך מתחילתו ועד סופו ולחוות תחושת מסוגלות.</p><p><strong>יתרונות אפשריים:</strong> חיזוק ביטחון עצמי ותחושת מסוגלות, תרגול סבלנות ודחיית סיפוקים, תכנון וסדר פעולות, שיתוף פעולה ותקשורת, עבודה חושית ומוטורית, יצירתיות וגמישות בהתמודדות עם טעויות ושינויים.</p><p><a class="btn gold" href="cooking-baking.html">לעמוד בישול ואפייה</a></p>'
          anchor = '<h2>היתרון של מרכז עדן לאורך כל התהליך</h2>'
          if 'href="cooking-baking.html"' not in s and anchor in s:
              s = s.replace(anchor, block + anchor, 1)
          if '<option>בישול ואפייה</option>' not in s:
              s = s.replace('<option>אחר</option>', '<option>בישול ואפייה</option><option>אחר</option>', 1)
          services.write_text(s, encoding='utf-8')

          # 4. Create the new page in the same design system as the rest of the site.
          page = root / 'cooking-baking.html'
          page.write_text('''<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בישול ואפייה ככלי רגשי וחווייתי | מרכז עדן</title><meta name="robots" content="noindex,nofollow"><meta name="description" content="בישול ואפייה במרכז עדן כפעילות חווייתית התומכת בתחושת מסוגלות, ויסות, תכנון, יצירתיות ושיתוף פעולה."><meta name="theme-color" content="#087c91"><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="container"><span>מרכז עדן | מגע המים כדרך חיים</span><span>אילן רמון 5, נס ציונה | 08 6335333</span></div></div><nav class="nav"><div class="container navrow"><a class="brand" href="index.html"><img src="https://media.easy.co.il/images/UserThumbs/10143668_1752242943315_0.png" alt="לוגו מרכז עדן"><strong>מרכז עדן</strong></a><button class="mobileBtn" aria-label="פתיחת תפריט" aria-expanded="false">☰</button><div class="menu"><a href="index.html">דף הבית</a><a href="about.html">אודות</a><a href="services.html">טיפולים</a><a href="cooking-baking.html" class="active">בישול ואפייה</a><a href="eden-baby.html">Eden Baby</a><a href="pools.html">הבריכות</a><a href="team.html">הצוות</a><a href="autism.html">טיפול מותאם על הרצף</a><a href="knowledge.html">מרכז ידע</a><a href="contact.html">צור קשר</a></div><a class="btn" href="contact.html">שיחת התאמה</a></div></nav><header class="pageHero"><div class="container"><div class="breadcrumbs"><a href="index.html">דף הבית</a> ← <a href="services.html">טיפולים</a> ← בישול ואפייה</div><h1 class="title">בישול ואפייה ככלי רגשי וחווייתי</h1><p class="lead">המטבח הוא מקום של עשייה, בחירה, יצירתיות ותוצאה מוחשית. עבור ילדים רבים זו דרך טבעית ומהנה לתרגל מיומנויות רגשיות, חברתיות ותפקודיות תוך כדי חוויה של הצלחה.</p></div></header><section class="section"><div class="container"><div class="grid2"><div class="photo cookingPhoto" aria-label="ילדים מכינים עוגות במטבח"><img src="assets/cooking-baking-children.jpg" alt="ילדים מכינים עוגות במסגרת פעילות בישול ואפייה" loading="eager" style="width:100%;height:100%;min-height:390px;object-fit:cover;object-position:center;display:block"></div><div class="content"><h2>למה בישול ואפייה יכולים לעזור בעבודה רגשית</h2><p>בישול ואפייה יוצרים מסגרת ברורה: בוחרים, מתכננים, מודדים, מערבבים, ממתינים ורואים תוצאה. בתוך התהליך הזה אפשר לתרגל באופן טבעי סבלנות, התמודדות עם תסכול, קבלת החלטות, גמישות ותחושת אחריות.</p><p>היתרון הגדול הוא שהעבודה נעשית דרך פעולה ולא רק דרך שיחה. ילד שמכין בעצמו עוגה, עוגיות או מאכל אחר מקבל חוויה מוחשית של יכולת ושל השלמת משימה, ולעיתים קל יותר לפתוח דרך העשייה שיחה על רגשות, בחירות, טעויות והצלחות.</p><p>הפעילות יכולה להשתלב כמענה חווייתי משלים בהתאם לגיל, לצורך ולמטרות שנקבעו עם המשפחה ואיש המקצוע.</p></div></div><h2 class="title center" style="margin-top:3.2rem">היתרונות האפשריים של הפעילות</h2><div class="featureGrid"><div class="feature"><strong>תחושת מסוגלות וביטחון עצמי</strong><span>השלמת מתכון וקבלת תוצאה מוחשית מאפשרות לילד לראות מה הצליח ליצור בעצמו ולחוות הישג.</span></div><div class="feature"><strong>ויסות רגשי והתמודדות עם תסכול</strong><span>המתנה, שינוי בתוצאה או טעות במתכון יוצרים הזדמנות לתרגל עצירה, תיקון וגמישות בתוך מסגרת בטוחה.</span></div><div class="feature"><strong>תכנון, סדר ועצמאות</strong><span>קריאת שלבים, ארגון חומרי גלם וביצוע רצף פעולות מחזקים תכנון, אחריות ויכולת לבצע משימה מתחילתה ועד סופה.</span></div><div class="feature"><strong>מיומנויות חברתיות</strong><span>כאשר עובדים יחד מתרגלים חלוקת תפקידים, בקשת עזרה, המתנה לתור, שיתוף פעולה ותקשורת.</span></div><div class="feature"><strong>מוטוריקה וחוויה חושית</strong><span>לישה, ערבוב, מזיגה, קישוט ומדידה משלבים תנועה עדינה, תיאום ידיים ומפגש הדרגתי עם מרקמים וריחות.</span></div><div class="feature"><strong>יצירתיות ובחירה</strong><span>בחירת צורות, טעמים וקישוטים נותנת מקום להעדפה אישית, יוזמה וביטוי עצמי בדרך נעימה וחווייתית.</span></div></div><div class="content" style="margin-top:2.6rem"><h2>איך יכול להיראות מפגש</h2><p>מתחילים במשימה שמתאימה לגיל וליכולת. בוחרים מתכון פשוט וברור, מחלקים את התהליך לשלבים ומאפשרים לילד לקחת חלק פעיל ככל האפשר. איש הצוות יכול להשתמש במה שקורה בזמן אמת כדי לעבוד על המטרות שנבחרו: למשל המתנה, בקשת עזרה, התמודדות עם שינוי, שיתוף פעולה או חיזוק עצמאות.</p><p>אין צורך שהמנה תצא מושלמת. במקרים רבים דווקא ההזדמנות להתמודד עם משהו שלא יצא בדיוק כמתוכנן היא חלק חשוב מהלמידה.</p><div class="notice">בישול ואפייה יכולים לשמש פעילות חווייתית תומכת וכלי משלים בעבודה רגשית, אך אינם תחליף לטיפול רגשי מקצועי כאשר הוא נדרש. כאשר הפעילות מוגדרת כחלק מתהליך טיפולי, יש להתאימה להכשרת איש הצוות, לצרכים האישיים ולמטרות שנקבעו.</div><p><a class="btn" href="contact.html">לשיחת התאמה עם מרכז עדן</a> <a class="btn light" href="services.html">חזרה לכל הטיפולים</a></p></div></div></section><footer class="footer"><div class="container"><div class="footerGrid"><div><div class="brand"><img src="https://media.easy.co.il/images/UserThumbs/10143668_1752242943315_0.png" alt="לוגו מרכז עדן"><strong>מרכז עדן</strong></div><p>מרכז טיפולי בנס ציונה לילדים, נוער ומבוגרים. מקצועיות, יחס אישי ומעקב מסודר לאורך התהליך.</p></div><div><h4>טיפולים ופעילויות</h4><a href="hydrotherapy-children.html">הידרותרפיה לילדים</a><a href="therapeutic-swimming.html">שחייה טיפולית</a><a href="eden-baby.html">שחיית תינוקות</a><a href="cooking-baking.html">בישול ואפייה</a></div><div><h4>המרכז</h4><a href="about.html">אודות</a><a href="pools.html">הבריכות ואיכות המים</a><a href="team.html">הצוות</a><a href="knowledge.html">מרכז ידע</a></div><div><h4>יצירת קשר</h4><a href="tel:086335333">08 6335333</a><a href="mailto:edencenterinfo@gmail.com">edencenterinfo@gmail.com</a><span>אילן רמון 5, נס ציונה</span></div></div><div class="copy"><span>© 2026 מרכז עדן. כל הזכויות שמורות.</span><span><a href="privacy.html">מדיניות פרטיות</a> | <a href="accessibility.html">הצהרת נגישות</a></span></div></div></footer><div class="stickyContact"><a href="tel:086335333">חיוג מהיר</a><a href="contact.html">השארת פרטים</a></div><script src="app.js" defer></script></body></html>''', encoding='utf-8')

      - name: Verify only intended files
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cooking-baking.html' eden-center-v2/app.js
          grep -q 'cooking-baking-nav-fit' eden-center-v2/site-fixes.css
          grep -q 'בישול ואפייה' eden-center-v2/services.html
          grep -q 'cooking-baking-children.jpg' eden-center-v2/cooking-baking.html
          test -s eden-center-v2/assets/cooking-baking-children.jpg

      - name: Clean temporary automation and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .cooking-update-trigger .github/workflows/add-cooking-baking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eden-center-v2/app.js eden-center-v2/site-fixes.css eden-center-v2/services.html eden-center-v2/cooking-baking.html eden-center-v2/assets/cooking-baking-children.jpg .cooking-update-trigger .github/workflows/add-cooking-baking.yml
          git commit -m "Add cooking and baking treatment page"
          git push origin main
