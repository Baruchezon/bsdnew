name: Update lead success message

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-lead-success-message.yml'

permissions:
  contents: write

jobs:
  update-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update success message only
        shell: python
        run: |
          from pathlib import Path
          p = Path('eden-center-v2/app.js')
          s = p.read_text(encoding='utf-8')
          old = "msg.textContent='הפנייה התקבלה. צוות מרכז עדן יחזור אליכם בהקדם.'"
          new = "msg.textContent='תודה! הפנייה התקבלה בהצלחה. צוות מרכז עדן יחזור אליכם בהקדם.'"
          if old not in s:
              raise SystemExit('Expected success message not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit change and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-lead-success-message.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eden-center-v2/app.js .github/workflows/update-lead-success-message.yml
          git commit -m "Show thank you after successful lead"
          git push origin main
